  <textarea class="form-control" id="mmsxx-src" rows="24" spellcheck="false">// Title: Volcano Parade
// Copyright 2026 harayoki. All rights reserved.
// Powered by mmsxx-mml-studio (software planned for release under the MIT License).
// K005289 arpeggio — MIDI ch.1 rhythm/contour, reharmonized
// @d7 はMMSXXのMML標準機能。同じ旋律を7セントずらして内部で重ねるため、複製チャンネルは不要。
// ベースが半音〜全音ずつ下降するよう、各拍を転回形中心に再配置。
// D-A/C#-Bm-D/A → A-E/G#-F#m-A/E → Bm-F#m/A-G-D/F# → G-D/F#-Em-A/C#。
// dim・9th・強いジャズテンションは使わず、明るい循環感を優先する。
$INTRO = { o6 d8. f+16 a8 &gt;d8 &lt;a4 f+8 e8 }
$D_to_A = { o6 d f+ a &gt;d  &lt;c+ e a &gt;c+  &lt;b d f+ &gt;b  &lt;a d f+ a }
$A_to_Bm = { o5 a c+ e &gt;a  &lt;g+ b e g+  f+ a c+ f+  e a c+ e }
$Bm_to_G = { o5 b d f+ &gt;b  &lt;a c+ f+ a  g b &gt;d g  &lt;f+ a &gt;d f+ }
$G_to_D = { o5 g b &gt;d g  &lt;f+ a &gt;d f+  &lt;e g b &gt;e  &lt;c+ e a &gt;c+ }
$D_RETURN = { o5 d f+ a &gt;d  &lt;c+ e a &gt;c+  &lt;b d f+ &gt;b  &lt;a d f+ a }
// 2周目は同じ下降線の上で、Bm/F#mをG/Dへ置換して少し開けた響きにする。
$D2_to_A = { o6 d f+ a &gt;d  &lt;c+ e a &gt;c+  &lt;b d g &gt;b  &lt;a d f+ a }
$A2_to_Bm = { o5 a c+ e &gt;a  &lt;g+ b e g+  f+ a d f+  e a c+ e }
$Bm2_to_A = { o5 b d f+ &gt;b  &lt;a c+ f+ a  g+ b e g+  f+ a &gt;d f+ }
$A2_to_D = { o5 a c+ e &gt;a  &lt;g+ b e g+  f+ a d f+  e a c+ e }
// Bメロ: Fメジャーへ転調。8小節目のA7→DでAメロのDメジャーへ戻す。
// F-C/E-Dm-Bb | Gm-C-A7-D。アルペジオは16分音符を切らさない。
$B1 = { o5 f a c &gt;f  &lt;c a f c  f a c &gt;f  &lt;c a f c }
$B2 = { o5 e g c &gt;e  &lt;c g e c  e g c &gt;e  &lt;c g e c }
$B3 = { o5 d f a &gt;d  &lt;a f d a  d f a &gt;d  &lt;a f d a }
$B4 = { o5 b- d f &gt;b-  &lt;f d b- f  b- d f &gt;b-  &lt;f d b- f }
$B5 = { o5 g b- d &gt;g  &lt;d b- g d  g b- d &gt;g  &lt;d b- g d }
$B6 = { o5 c e g &gt;c  &lt;g e c g  c e g &gt;c  &lt;g e c g }
$B7 = { o5 a c+ e g  a g e c+  a c+ e g  a g e c+ }
$B8 = { o5 d f+ a &gt;d  &lt;a f+ d a  d f+ a &gt;d  &lt;a f+ d a }
// Cメロ: G-A-F#m-Bm | Em-G/A-A7-A7。上昇感を作り、AメロのDへ接続する。
$C1 = { o5 g b &gt;d g  &lt;d b g d  g b &gt;d g  &lt;d b g d }
$C2 = { o5 a c+ e &gt;a  &lt;e c+ a e  a c+ e &gt;a  &lt;e c+ a e }
$C3 = { o5 f+ a c+ &gt;f+  &lt;c+ a f+ c+  f+ a c+ &gt;f+  &lt;c+ a f+ c+ }
$C4 = { o5 b d f+ &gt;b  &lt;f+ d b f+  b d f+ &gt;b  &lt;f+ d b f+ }
$C5 = { o5 e g b &gt;e  &lt;b g e b  e g b &gt;e  &lt;b g e b }
$C6 = { o5 a b d g  a g d b  a b d g  a g d b }
$C7 = { o5 a c+ e g  a g e c+  a c+ e g  a g e c+ }
$C8 = { o5 a c+ e g  c+ e g &gt;c+  &lt;a g e c+  a e c+ a }
// 静かな4小節＋イントロ2。前半は高域を止め、最後の1小節だけ共通フレーズを戻す。
$QUIET = { r1 r1 o5 d2 a2  r2 e4 a4 }
$INTRO2 = { r1 o5 a8. f+16 d8 e8 f+4 e8 c+8 }
t135 l16 q7 v8 @{pulse18} @e{flat} @d7
// 小節別主役: M M A F | M B M F | M B A M（M=メロディ、A=アルペジオ、B=ベース、F=合いの手）
[ v6 $INTRO
[ v8 $D_to_A v8 $A_to_Bm v11 $Bm_to_G v6 $G_to_D v8 $D2_to_A v7 $A2_to_Bm v8 $Bm2_to_A v6 $A2_to_D
  v8 $B1 v7 $B2 v9 $B3 v7 $B4 v8 $B5 v7 $B6 v9 $B7 v8 $B8
  v8 $C1 v9 $C2 v7 $C3 v9 $C4 v8 $C5 v10 $C6 v9 $C7 v8 $C8
  v4 $QUIET v6 $INTRO2 ]2
// Ending: 後半で和音全体を半音ずつ駆け上がり、1オクターブ上へ到達する。
o5 v7 @{pulse18} @e{flat} d2 d8 d+32 e32 f32 f+32 g32 g+32 a32 b-32 b32 &gt;c32 c+32 d32

// AY melody — 忙しいアルペジオとベースに対し、長音と休符で呼吸を作る。
// 制約: 現行MMLにはポルタメント命令が無い。音符間の連続的な音程移動はできない。
// 代わりに音階を順次進行にして滑らかに聞かせる。4・8小節目は全休符にして合いの手へ渡す。
// イントロだけは全パートが同じフレーズをユニゾンで演奏する。
// デチューン高音に埋もれないようv12。@e{soft}で80%まで穏やかに減衰する。
// 2分音符だけ@{tnLead}へ切替。約0.3秒はビブラートなしの直進音、その後ビブラートが立ち上がる。
t135 l16 q8 v12 @{pulse25} @e{soft}
// 1小節イントロ共通フレーズ。
[ o5 v9 d8. f+16 a8 &gt;d8 &lt;a4 f+8 e8
[ o5 v13 @{tnLead} @e{soft} f+2 @{pulse25} e4 d4
o5 v13 @{tnLead} @e{soft} c+2 @{pulse25} b4 r4
o5 v10 @{tnLead} @e{soft} d2 @{pulse25} e4 f+4
o5 r1
o5 v13 @{tnLead} @e{soft} a2 @{pulse25} g4 f+4
o5 v10 @{tnLead} @e{soft} e2 @{pulse25} d4 r4
o5 v13 @{tnLead} @e{soft} f+2 @{pulse25} e4 d4
o5 r1
// Bメロ8小節。Fメジャーの明るさを保ち、後半で進行感を強めてDへ帰る。
o5 v13 @{tnLead} @e{soft} a2 @{pulse25} g4 f4
o5 v10 @{tnLead} @e{soft} g2 @{pulse25} e4 r4
o5 v11 @{tnLead} @e{soft} f2 @{pulse25} a4 g4
o5 v12 @{tnLead} @e{soft} d2 @{pulse25} f4 r4
o5 v11 @{tnLead} @e{soft} b-2 @{pulse25} a4 g4
o5 v12 @{tnLead} @e{soft} g2 @{pulse25} c4 b-4
o5 v13 @{tnLead} @e{soft} c+2 @{pulse25} e4 g4
o5 v13 @{tnLead} @e{soft} f+2 @{pulse25} e4 d4
// Cメロ8小節。Bより高い音域へ持ち上げ、後半はA7上でAメロを待つ。
o5 v12 @{tnLead} @e{soft} b2 @{pulse25} a4 g4
o5 v13 @{tnLead} @e{soft} c+2 @{pulse25} e4 a4
o5 v11 @{tnLead} @e{soft} a2 @{pulse25} c+4 b4
o5 v13 @{tnLead} @e{soft} d2 @{pulse25} f+4 a4
o5 v12 @{tnLead} @e{soft} g2 @{pulse25} b4 &gt;e4
o6 v13 @{tnLead} @e{soft} d2 @{pulse25} c+4 b4
o5 v12 @{tnLead} @e{soft} a2 @{pulse25} c+4 e4
o5 v13 @{tnLead} @e{soft} g2 @{pulse25} e4 c+4
// 静かな4小節。長音と休符で密度を落とす。
o5 v7 @{pulse25} @e{soft} d1
o5 r1
o4 v7 @{tnLead} @e{soft} a2 @{pulse25} g4 r4
o4 v6 @{tnLead} @e{soft} e2 r2
// イントロ2。
o5 r1
o5 v11 @{pulse25} @e{soft} a8. f+16 d8 e8 f+4 e8 c+8 ]2
// Ending: root rises chromatically by one octave.
o5 v9 @{tnLead} @e{soft} d2 d8 d+32 e32 f32 f+32 g32 g+32 a32 b-32 b32 &gt;c32 c+32 d32

// Triangle bass — low eighth + two high sixteenths。跳躍を抑えた下降ベース。
// 全区間・全音で、輪郭を補うpulse50矩形波を元の約半分の強さで同音程に重ねる。
// 半音または全音で下がり、4拍目で少し止めてから次の小節へ着地する。
t135 l16 q7 v14 @{triangle} @e{flat}
// イントロはメロディーと同じフレーズを低音ユニゾンで演奏する。
[ v10 o2 d8. f+16 a8 &gt;d8 &lt;a4 f+8 e8
[ v11 o2 d8 &gt;d d o2 c+8 &gt;c+ c+ o2 b8 &gt;b b o2 a8 &gt;a a
v11 o2 a8 &gt;a a o2 g+8 &gt;g+ g+ o2 f+8 &gt;f+ f+ o2 e8 &gt;e e
v11 o2 b8 &gt;b b o2 a8 &gt;a a o2 g+8 &gt;g+ g+ o2 f+8 &gt;f+ f+
v9 o2 g8 &gt;g g o2 f+8 &gt;f+ f+ o2 e8 &gt;e e o2 c+8 &gt;c+ c+
v11 o2 d8 &gt;d d o2 c+8 &gt;c+ c+ o2 b8 &gt;b b o2 a8 &gt;a a
v14 o2 a8 &gt;a a o2 g+8 &gt;g+ g+ o2 f+8 &gt;f+ f+ o2 e8 &gt;e e
v11 o2 b8 &gt;b b o2 a8 &gt;a a o2 g8 &gt;g g o2 f+8 &gt;f+ f+
v9 o2 a8 &gt;a a o2 g+8 &gt;g+ g+ o2 f+8 &gt;f+ f+ o2 e8 &gt;e e
// Bメロは4分音符中心。後半で根音の動きを強め、A7からDへ帰る。
v10 o2 f4 c4 f4 e4
v12 o2 e4 g4 c4 e4
v10 o2 d4 a4 d4 c4
v11 o2 b-4 f4 b-4 a4
v12 o2 g4 d4 g4 b-4
v11 o2 c4 g4 c4 b-4
v13 o2 a4 e4 g4 c+4
v13 o2 d4 a4 d4 r4
// Cメロは上向きの4分音符パターン。終盤はAを保持して帰着を待つ。
v11 o2 g4 d4 g4 b4
v12 o2 a4 e4 a4 c+4
v10 o2 f+4 c+4 f+4 a4
v12 o2 b4 f+4 b4 d4
v11 o2 e4 b4 e4 g4
v13 o2 a4 e4 g4 b4
v12 o2 a4 e4 g4 c+4
v13 o2 a4 a4 e4 c+4
// 静かな4小節。根音を長く保持する。
v7 o2 d1
v6 o2 b-1
v7 o2 g1
v8 o2 a1
// イントロ2。
o2 r1
v10 o2 a8. f+16 d8 e8 f+4 e8 c+8 ]2
// Ending: low D rises chromatically by one octave.
o2 v11 @{triangle} @e{flat} d2 d8 d+32 e32 f32 f+32 g32 g+32 a32 b-32 b32 &gt;c32 c+32 d32

// AY call-and-response / harmony — Aメロは4・8小節目の合いの手、Bメロは主旋律の下ハモリ。
// 合いの手はtnArpBite + percussive。鳴り始めを強くし、短く切れる金属音にする。
// ハモリはpulse18 + softで主旋律より少し細くする。
t135 o4 l8 q5 v10 @{tnArpBite} @e{percussive}
// I1の後、A・B・C・静かな4小節・I2を2回。
r1
[ o4 r1 r1 r1
v15 r8 g8 b8 &gt;d8 &lt;a8 f+8 e8 c+8
r1 r1 r1
v15 r8 a8 &gt;c+8 e8 &lt;b8 a8 f+8 e8
// Bメロ: Fメジャー内で主旋律からおおむね3度下。リズムと休符位置は主旋律に揃える。
o5 l16 q8 v8 @{pulse18} @e{soft} f2 e4 d4
o5 v7 e2 c4 r4
o5 v7 d2 f4 e4
o4 v8 b-2 &gt;d4 r4
o5 v7 g2 f4 e4
o5 v8 e2 a4 g4
o5 v8 a2 c+4 e4
o5 v8 d2 c+4 a4
// Cメロは3度下中心。終盤だけ反行してAへの戻りを目立たせる。
o5 v8 g2 f+4 e4
o5 v8 a2 c+4 e4
o5 v7 f+2 a4 g4
o5 v8 b2 d4 f+4
o5 v8 e2 g4 b4
o5 v9 b2 a4 g4
o5 v8 f+2 a4 c+4
o5 v8 e2 c+4 a4
// 静かな4小節ではハモリを止める。
o4 r1 r1 r1 r1
// I2の最後だけ低い合いの手を入れる。
o4 r1
o4 v11 @{tnArpBite} @e{percussive} a8. f+16 d8 e8 f+4 e8 c+8 ]2
// Ending: major third rises chromatically by one octave.
o5 l16 q8 v7 @{pulse25} @e{soft} f+2 f+8 g32 g+32 a32 b-32 b32 &gt;c32 c+32 d32 d+32 e32 f32 f+32

// 合いの手のオクターブ下レイヤー。単旋律MMLでは同時発音できないため独立チャンネルで重ねる。
$REST4 = { r1 r1 r1 r1 }
$REST8 = { r1 r1 r1 r1 r1 r1 r1 r1 }
t135 o3 l8 q5 v8 @{tnArpBite} @e{percussive}
// I1
r1
// Aの4・8小節目だけ上の合いの手と同時発音。B・C・静かな区間は休む。
[ o3 r1 r1 r1
v9 r8 g8 b8 &gt;d8 &lt;a8 f+8 e8 c+8
r1 r1 r1
v9 r8 a8 &gt;c+8 e8 &lt;b8 a8 f+8 e8
$REST8 $REST8 $REST4
// I2
r1
o3 v8 a8. f+16 d8 e8 f+4 e8 c+8 ]2
// Ending: fifth rises chromatically by one octave.
o4 l16 q8 v6 @{pulse25} @e{soft} a2 a8 b-32 b32 &gt;c32 c+32 d32 d+32 e32 f32 f+32 g32 g+32 a32

// Noise hi-hat — 裏拍のクローズを基本に、4小節程度ごとに短いオープンを混ぜる。
// イントロ1小節と静かな区間は休み。キックやスネアは入れない。

  (() => {
  const root = document.getElementById('mmsxx-inline');
  const src = root.querySelector('#mmsxx-src');
  const status = root.querySelector('#mmsxx-status');
  let ctx = null, master = null, nodes = [], timers = [];
  const semi = {c:0,d:2,e:4,f:5,g:7,a:9,b:11};
  function stop(){
    timers.forEach(clearTimeout); timers=[];
    nodes.forEach(n => { try { n.stop(); } catch {} }); nodes=[];
    if(master){ try { master.disconnect(); } catch {} master=null; }
    status.textContent = 'Stopped';
  }
  function voicesOf(text){
    return text.split(/\r?\n\s*\r?\n/).map(v => v.replace(/^\s*\/\/.*$/gm,' ').trim()).filter(Boolean);
  }
  function expandMacros(text){
    const defs=new Map();
    let body=text.replace(/\$([\w\u0080-\uFFFF]+)\s*=\s*\{([^{}]*)\}/g,(_,name,value)=>{ defs.set(name,value); return ' '; });
    for(let n=0;n<32 && /\$[\w\u0080-\uFFFF]+/.test(body);n++){
      body=body.replace(/\$([\w\u0080-\uFFFF]+)/g,(_,name)=>defs.get(name)||'');
    }
    return body;
  }
  function expandRepeats(text){
    let src=text;
    for(let guard=0;guard<64;guard++){
      const open=src.lastIndexOf('[');
      if(open<0) break;
      const close=src.indexOf(']',open+1);
      if(close<0){ src=src.slice(0,open)+src.slice(open+1); continue; }
      let end=close+1;
      while(end<src.length && /\d/.test(src[end])) end++;
      const count=+(src.slice(close+1,end)||2);
      src=src.slice(0,open)+src.slice(open+1,close).repeat(Math.max(0,count))+src.slice(end);
    }
    return src.replace(/[\[\]]/g,'');
  }
  function parse(v){
    v=expandRepeats(expandMacros(v));
    let tempo=120, len=4, gate=7, vol=12, oct=4, detune=0, tone='88fm4EP', env='flat', time=0;
    const events=[];
    const tokens=v.match(/@\{[^}]+\}|@e\{[^}]+\}|@d\d+|[<>]|[tloqv]\d+|[a-gr](?:[+-])?\d*\.?/gi)||[];
    for(const raw of tokens){
      const x=raw.toLowerCase();
      if(x[0]==='t') tempo=+x.slice(1); else if(x[0]==='l') len=+x.slice(1);
      else if(x[0]==='q') gate=+x.slice(1); else if(x[0]==='v') vol=+x.slice(1);
      else if(x[0]==='o') oct=+x.slice(1); else if(x.startsWith('@d')) detune=+x.slice(2);
      else if(x.startsWith('@e{')) env=raw.slice(3,-1).toLowerCase();
      else if(x.startsWith('@{')) tone=raw.slice(2,-1); else if(x==='>') oct++; else if(x==='<') oct--;
      else if(/[a-gr]/.test(x[0])){
        const m=x.match(/^([a-gr])([+-]?)(\d+)?(\.)?$/); if(!m) continue;
        const n=+(m[3]||len), dur=(60/tempo)*4/n*(m[4]?1.5:1);
        if(m[1]!=='r'){
          let s=semi[m[1]]+(m[2]==='+'?1:m[2]==='-'?-1:0);
          const midi=12*(oct+1)+s;
          events.push({at:time,dur,gate:dur*Math.min(gate,8)/8,freq:440*Math.pow(2,(midi-69)/12),vol:vol/15,detune,tone,env});
        }
        time+=dur;
      }
    }
    return {events,total:time};
  }
  function kWave(variant){
    const a=variant ? [0,2,5,7,7,5,3,2,1,2,4,6,7,5,2,-1,-4,-6,-7,-5,-2,0,1,0,-2,-4,-5,-4,-2,-1,0,0]
                    : [0,3,6,7,6,4,3,2,2,3,5,6,5,2,-1,-4,-6,-7,-6,-3,0,2,3,2,0,-2,-4,-4,-3,-2,-1,0];
    const n=a.length, real=new Float32Array(n/2+1), imag=new Float32Array(n/2+1);
    for(let k=1;k<real.length;k++) for(let j=0;j<n;j++){
      real[k]+=a[j]/7*Math.cos(2*Math.PI*k*j/n)*2/n;
      imag[k]-=a[j]/7*Math.sin(2*Math.PI*k*j/n)*2/n;
    }
    return ctx.createPeriodicWave(real,imag,{disableNormalization:false});
  }
  function schedule(e, base){
    const wave=/wtk005289|sawstep/i.test(e.tone), thin=/pulse18/i.test(e.tone), bass=/triangle/i.test(e.tone), noise=/noise/i.test(e.tone), metal=/tnArpBite/i.test(e.tone);
    const t=base+e.at, end=t+e.gate;
    if(noise){
      const amp=ctx.createGain(), source=ctx.createBufferSource();
      const hatLength=e.openHat?.22:.055;
      const frames=Math.max(1,Math.floor(ctx.sampleRate*hatLength)), buffer=ctx.createBuffer(1,frames,ctx.sampleRate), data=buffer.getChannelData(0);
      for(let i=0;i<frames;i++) data[i]=Math.random()*2-1;
      source.buffer=buffer; source.connect(amp).connect(master);
      const peak=Math.min(e.openHat?.026:.035,e.vol*(e.openHat?.018:.025)), stopAt=Math.min(end,t+hatLength);
      amp.gain.setValueAtTime(peak,t);
      amp.gain.exponentialRampToValueAtTime(.0001,stopAt);
      source.start(t); source.stop(stopAt+.01); nodes.push(source);
      return;
    }
    const car=ctx.createOscillator(), amp=ctx.createGain(), oscillators=[car];
    if(wave) car.setPeriodicWave(kWave(/b$/i.test(e.tone))); else car.type=bass?'triangle':thin?'sawtooth':metal?'triangle':'square';
    car.frequency.value=e.freq; car.detune.value=0;
    if(e.detune>0){
      const twin=ctx.createOscillator();
      if(wave) twin.setPeriodicWave(kWave(/b$/i.test(e.tone))); else twin.type=thin?'sawtooth':'square';
      twin.frequency.value=e.freq; twin.detune.value=e.detune; twin.connect(amp); oscillators.push(twin);
    }
    car.connect(amp).connect(master);
    if(bass && e.squareLayer){
      const square=ctx.createOscillator(), squareGain=ctx.createGain(), squareFilter=ctx.createBiquadFilter();
      square.type='square'; square.frequency.value=e.freq;
      // 高いベース音ほど矩形波の倍音を丸め、耳に刺さる成分だけ抑える。
      squareGain.gain.value=e.freq>130?.24:.45;
      squareFilter.type='lowpass'; squareFilter.frequency.value=Math.max(360,900-e.freq*2.5); squareFilter.Q.value=.45;
      square.connect(squareFilter).connect(squareGain).connect(amp);
      oscillators.push(square);
    }
    if(metal){
      const overtone=ctx.createOscillator(), overtoneGain=ctx.createGain();
      overtone.type='square'; overtone.frequency.value=e.freq*2.71;
      overtoneGain.gain.value=.34;
      overtone.connect(overtoneGain).connect(amp);
      oscillators.push(overtone);
    }
    if(/tnLead/i.test(e.tone)){
      const lfo=ctx.createOscillator(), depth=ctx.createGain(), vibAt=Math.min(end,t+.30);
      lfo.frequency.value=6;
      depth.gain.setValueAtTime(0,t);
      depth.gain.setValueAtTime(0,vibAt);
      depth.gain.linearRampToValueAtTime(e.freq*.02,Math.min(end,vibAt+.08));
      lfo.connect(depth).connect(car.frequency);
      lfo.start(t); lfo.stop(end+.05); nodes.push(lfo);
    }
    const peak=metal ? Math.min(.27,e.vol*.115) : Math.min(.24,e.vol*(wave?.095:thin?.065:bass?.115:.055));
    const held=e.env==='flat', piano=e.env==='piano', pluck=e.env==='pluck', perc=e.env==='percussive';
    const attack=held ? 0.003 : piano ? 0.004 : pluck ? 0.002 : perc ? 0.001 : 0.008;
    const sustain=held ? 1 : piano ? .35 : pluck ? .15 : perc ? .05 : .8;
    const release=held ? 0.075 : piano ? .04 : pluck ? .03 : perc ? .02 : 0.025;
    amp.gain.setValueAtTime(0,t); amp.gain.linearRampToValueAtTime(peak,t+attack);
    amp.gain.linearRampToValueAtTime(peak*sustain,Math.min(end,t+Math.max(.03,e.gate*.4)));
    amp.gain.setValueAtTime(peak*sustain,end);
    amp.gain.exponentialRampToValueAtTime(.0001,end+release);
    oscillators.forEach(o=>{ o.start(t); o.stop(end+release+.025); nodes.push(o); });
  }
  async function play(){
    stop(); ctx ||= new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    master=ctx.createGain(); master.gain.value=.42; master.connect(ctx.destination);
    const parsed=voicesOf(src.value).map(parse), base=ctx.currentTime+.06;
    const total=Math.max(0,...parsed.map(v=>v.total));
    // ベース全音で、三角波へ矩形波を半分の強さで重ねる。
    if(parsed[2]) parsed[2].events.forEach(e=>{ e.squareLayer=true; });
    // メロディ・ハモリ・合いの手と衝突する瞬間だけアルペジオを約半分へ。
    const foreground=[parsed[1],parsed[3],parsed[4]].filter(Boolean).flatMap(v=>v.events);
    if(parsed[0]) parsed[0].events.forEach(e=>{
      e.vol*=1.08;
      if(foreground.some(f=>f.at < e.at+e.gate && f.at+f.gate > e.at)) e.vol*=.48;
    });
    // ベースは拍頭を少し引き、8分裏を強調する。
    const beat=60/135;
    if(parsed[2]) parsed[2].events.forEach(e=>{
      const phase=(e.at/beat)%1;
      e.vol*=Math.abs(phase-.5)<.09 ? 1.38 : .84;
    });
    // ハイハットは16打ごとの末尾だけ短いオープン。音量はクローズより控えめ。
    const hats=parsed[5]?.events||[];
    hats.forEach((e,i)=>{ e.openHat=(i%16===15); });
    // 長いリピートでも止まらないよう、約8秒先までを4秒ごとに追加予約する。
    const cursors=parsed.map(()=>0);
    const queue=()=>{
      if(!master) return;
      const horizon=Math.max(8,ctx.currentTime-base+8);
      parsed.forEach((v,vi)=>{
        while(cursors[vi]<v.events.length && v.events[cursors[vi]].at<horizon){
          schedule(v.events[cursors[vi]++],base);
        }
      });
      if(horizon<total+1) timers.push(setTimeout(queue,4000));
    };
    queue();
    status.textContent=`Playing / ${total.toFixed(2)} sec`;
    timers.push(setTimeout(() => { if(master) status.textContent='Finished'; }, total*1000+500));
  }
  root.querySelector('#mmsxx-play').addEventListener('click',play);
  root.querySelector('#mmsxx-stop').addEventListener('click',stop);
})();
</script>
