<style>
:root{color-scheme:dark;--background:#181818;--foreground:#f5f7fb;--muted:#252831;--muted-foreground:#aab2c3;--border:#505765;--blue:#f18c56;--accent-ink:#161616}
#killing .mix-tabs{display:flex;align-items:stretch;width:100%;gap:0}
#killing .mix-tabs button{flex:1;min-width:0;margin:0 0 -1px;padding:12px 8px;color:#e5e8ff;background:#10111b;border:2px solid #777cc8;border-radius:0;cursor:pointer;font:inherit;font-weight:650}
#killing .mix-tabs button+button{border-left:1px solid #777cc8}
#killing .mix-tabs button:first-child{border-radius:8px 0 0 0}
#killing .mix-tabs button:last-child{border-radius:0 8px 0 0}
#killing .mix-tabs button[aria-selected="true"]{color:#fff;background:#4c48db;border-color:#8a8fff;position:relative;z-index:1}
#killing .mix-tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-4px}
#killing .cm-mml-shell{background-position:center;background-size:cover;background-repeat:no-repeat}
</style></head><body>
<main class="music-page" id="killing">
<nav class="music-top-nav" aria-label="ページナビゲーション"><a href="../" aria-label="1階層上へ" title="1階層上へ">↑</a></nav>
<div class="music-player" id="killing-player" role="tabpanel" aria-labelledby="tab-normal"></div>
<p class="music-status text-small text-muted" data-music-status aria-live="polite">読み込み中…</p>
<div class="music-editor">
<div class="mix-tabs" role="tablist" aria-label="バージョン選択">
<button type="button" role="tab" id="tab-normal" aria-controls="killing-player" aria-selected="true" tabindex="0" data-variant="normal">オリジナル版</button>
<button type="button" role="tab" id="tab-msx" aria-controls="killing-player" aria-selected="false" tabindex="-1" data-variant="msx">MSX版（PSG + SCC + OPLL）</button>
</div>
<textarea placeholder="LOADING" id="killing-src" aria-label="MMLソース" rows="24" spellcheck="false" disabled data-music-background="bg.jpg"></textarea>
