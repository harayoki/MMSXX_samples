<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>天空のドミナント</title>
  <meta name="description" content="アクションRPGで天空城へ登る階段をイメージした曲。NES音源を想定。">
  <link rel="stylesheet" href="../music-page.css">
  <style>
    /* Keep the channel-volume controls on the heading line, not stranded below the last channel. */
    #sky-dominant .music-player [data-p="chsrow"] {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "label tools" "channels channels";
      align-items: center;
      gap: 6px 10px;
    }
    #sky-dominant .music-player [data-p="chslbl"] { grid-area: label; }
    #sky-dominant .music-player [data-p="chs"] {
      grid-area: channels;
      min-width: 0;
    }
    #sky-dominant .music-player .chmode {
      grid-area: tools;
      margin-left: 0;
      justify-self: end;
    }
  </style>
</head>
<body>
<main class="music-page" id="sky-dominant">
  <nav class="music-top-nav" aria-label="ページナビゲーション"><a href="../" aria-label="1階層上へ" title="1階層上へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4M5.5 10.5 12 4l6.5 6.5"/></svg></a></nav>
  <div class="music-player" id="sky-dominant-player"></div>
  <p class="music-status text-small text-muted" data-music-status aria-live="polite"></p>
  <div class="music-credits">
    <p class="text-small text-muted">MMLはこの場で編集できます。Music, artwork, MML and exports:
      <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>.
      <a href="./tenkuu_mml.png" data-music-image="tenkuu_mml.png">Cover art</a>.</p>
  </div>
  <div class="music-editor">
    <textarea placeholder="LOADING" aria-label="MMLソース"
      data-music-background="tenkuu_mml.png" id="sky-dominant-src"
      rows="24" spellcheck="false" disabled></textarea>
  </div>
  <div class="music-credits">
    <p class="text-small text-muted">JavaScript source is not covered by CC BY 4.0. Redistribution is prohibited.</p>
    <p class="text-small text-muted">Editor: <a href="https://codemirror.net/">CodeMirror 6</a> (MIT License).</p>
  </div>
</main>
<script src="../music-page.js" data-song="12_Sky-Dominant"></script>
</body>
</html>
