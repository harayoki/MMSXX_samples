<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pocket Tunnel</title>
  <link rel="stylesheet" href="../music-page.css">
</head>
<body>
<main class="music-page" id="pocket-tunnel">
  <nav aria-label="ページナビゲーション"><a href="../">MUSIC TOP</a></nav>
  <div class="music-player" id="pt-player"></div>
  <p class="music-status text-small text-muted" data-music-status aria-live="polite"></p>
  <p class="text-small text-muted">Music, artwork, MML source and exported WAV:
    <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>.
    JavaScript source is not covered by CC BY 4.0. Redistribution is prohibited.</p>
  <p id="pt-comment" aria-live="polite"></p>
  <div class="music-editor">
    <div class="mix-tabs" id="pt-mixes" role="tablist" aria-label="アレンジ選択"></div>
    <textarea placeholder="LOADING" data-music-background="pocket-tunnel.jpg"
      id="pt-src" aria-label="MMLソース" rows="24" spellcheck="false" disabled></textarea>
  </div>
  <p class="text-small">This
    <a href="./pocket-tunnel.png" data-music-image="pocket-tunnel.png">cover art</a>
    was created with mmsxx-pixel-studio. MMLの編集は、フォーカスを外すと再生へ反映されます。</p>
</main>
<script src="../music-page.js" data-song="02_Pocket-Tunnel"></script>
</body>
</html>
